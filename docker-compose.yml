services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windsight-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DECISION_CUTOFF_HOUR_UTC=0
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - windsight-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: windsight-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - windsight-net

networks:
  windsight-net:
    driver: bridge
